<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Meine Musik App</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#ffffff" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Musik" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />

<link rel="stylesheet" href="style.css" />
</head>
<body>

<svg style="display:none">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M6 10v9a1 1 0 0 0 1 1h3v-6h4v6h3a1 1 0 0 0 1-1v-9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-4.3-4.3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-library" viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="4" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="4" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="13" y="13" width="7" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
  <symbol id="i-chevron-left" viewBox="0 0 24 24"><polyline points="15 6 9 12 15 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevron-right" viewBox="0 0 24 24"><polyline points="9 6 15 12 9 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-chevron-down" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" fill="currentColor"/></symbol>
  <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4" height="14" fill="currentColor"/><rect x="14" y="5" width="4" height="14" fill="currentColor"/></symbol>
  <symbol id="i-skip-back" viewBox="0 0 24 24"><path d="M19 5v14l-11-7z" fill="currentColor"/><rect x="5" y="5" width="2" height="14" fill="currentColor"/></symbol>
  <symbol id="i-skip-forward" viewBox="0 0 24 24"><path d="M5 5v14l11-7z" fill="currentColor"/><rect x="17" y="5" width="2" height="14" fill="currentColor"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M3 7h3l9 10h4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 17h3l2.5-3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M15 7h4M17 5l2 2-2 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M17 19l2-2-2-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-repeat" viewBox="0 0 24 24"><path d="M17 1l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 11V9a4 4 0 0 1 4-4h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M7 23l-4-4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M21 13v2a4 4 0 0 1-4 4H3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5 8.74 5 10.5 6.5 12 8.5 13.5 6.5 15.26 5 17.5 5 21 5 23.5 8.5 21.5 12.5 19 16.65 12 21 12 21z" fill="currentColor"/></symbol>
  <symbol id="i-heart-o" viewBox="0 0 24 24"><path d="M12 21s-7-4.35-9.5-8.5C.5 8.5 3 5 6.5 5 8.74 5 10.5 6.5 12 8.5 13.5 6.5 15.26 5 17.5 5 21 5 23.5 8.5 21.5 12.5 19 16.65 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-device" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M2 20h20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
</svg>

  <!-- Login-Ansicht -->
  <section id="login-view" class="screen login-screen">
    <div class="login-card">
      <div class="login-mark">&#9835;</div>
      <h1>Meine Musik App</h1>
      <p class="login-sub">Verbinde deinen Spotify-Premium-Account, um loszulegen.</p>
      <button id="login-btn" class="pill-btn dark">Mit Spotify verbinden</button>
      <p class="login-hint">Zum Abspielen wird Spotify Premium benötigt.</p>
    </div>
  </section>

  <!-- App-Shell -->
  <div id="app-shell" class="hidden">

    <main id="screens">

      <!-- Home -->
      <section id="home-screen" class="screen">
        <div class="top-row">
          <div>
            <div class="eyebrow" id="greeting">Guten Abend</div>
            <div class="user-name" id="user-name"></div>
          </div>
          <div class="avatar" id="user-avatar-wrap"><img id="user-avatar" alt="" /></div>
        </div>
        <div class="section-label">Zuletzt gehört</div>
        <div class="row-list" id="recent-tracks"></div>
      </section>

      <!-- Suche -->
      <section id="search-screen" class="screen hidden">
        <div class="screen-title">Suche</div>
        <div class="search-bar">
          <svg class="icon muted" width="16" height="16"><use href="#i-search"/></svg>
          <input id="search-input" type="text" placeholder="Songs, Artists, Alben" />
        </div>
        <div class="section-label" id="search-label"></div>
        <div class="row-list" id="search-results"></div>
      </section>

      <!-- Bibliothek -->
      <section id="library-screen" class="screen hidden">
        <div class="screen-title">Bibliothek</div>
        <div class="section-label">Playlists</div>
        <div class="row-list" id="library-playlists"></div>
      </section>

      <!-- Playlist-Detail -->
      <section id="playlist-screen" class="screen hidden">
        <button id="playlist-back" class="icon-btn" aria-label="Zurück">
          <svg class="icon" width="18" height="18"><use href="#i-chevron-left"/></svg>
        </button>
        <div class="playlist-header">
          <img id="playlist-cover" class="cover cover-lg" alt="" />
          <div class="playlist-title" id="playlist-title"></div>
          <div class="playlist-sub" id="playlist-sub"></div>
          <button id="playlist-play-btn" class="pill-btn dark sm">
            <svg class="icon" width="12" height="12"><use href="#i-play"/></svg>
            <span>Play</span>
          </button>
        </div>
        <div class="track-rows" id="playlist-tracks"></div>
      </section>

    </main>

    <!-- Mini-Player -->
    <button id="mini-player" class="mini-player hidden">
      <img id="mini-cover" class="cover cover-xs" alt="" />
      <div class="mini-meta">
        <div class="mini-title" id="mini-title">–</div>
        <div class="mini-artist" id="mini-artist">–</div>
      </div>
      <span id="mini-play-btn" class="mini-play-btn" role="button" aria-label="Play/Pause">
        <svg class="icon" width="16" height="16"><use id="mini-play-icon" href="#i-play"/></svg>
      </span>
    </button>

    <!-- Tab-Bar -->
    <nav id="tab-bar" class="tab-bar">
      <button class="tab-btn active" data-tab="home" aria-label="Home">
        <span class="tab-dot"><svg class="icon" width="15" height="15"><use href="#i-home"/></svg></span>
      </button>
      <button class="tab-btn" data-tab="search" aria-label="Suche">
        <span class="tab-dot"><svg class="icon" width="15" height="15"><use href="#i-search"/></svg></span>
      </button>
      <button class="tab-btn" data-tab="library" aria-label="Bibliothek">
        <span class="tab-dot"><svg class="icon" width="15" height="15"><use href="#i-library"/></svg></span>
      </button>
    </nav>

    <!-- Vollbild-Player -->
    <div id="player-overlay" class="player-overlay hidden">
      <button id="player-close" class="icon-btn center" aria-label="Schließen">
        <svg class="icon" width="18" height="18"><use href="#i-chevron-down"/></svg>
      </button>
      <div class="now-playing-label">Wird abgespielt</div>

      <div class="player-cover-wrap">
        <img id="player-cover" class="cover cover-xl" alt="" />
      </div>

      <div class="player-meta">
        <div>
          <div class="player-title" id="player-title">–</div>
          <div class="player-artist" id="player-artist">–</div>
        </div>
        <span id="player-like-btn" class="icon-btn" role="button" aria-label="Favorit">
          <svg class="icon" width="18" height="18"><use href="#i-heart-o"/></svg>
        </span>
      </div>

      <div class="progress-track">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <div class="progress-times">
        <span id="time-current">0:00</span>
        <span id="time-total">0:00</span>
      </div>

      <div class="controls-row">
        <span id="shuffle-btn" class="ctrl-btn muted" role="button" aria-label="Shuffle">
          <svg class="icon" width="16" height="16"><use href="#i-shuffle"/></svg>
        </span>
        <span id="prev-btn" class="ctrl-btn" role="button" aria-label="Zurück">
          <svg class="icon" width="20" height="20"><use href="#i-skip-back"/></svg>
        </span>
        <span id="play-pause-btn" class="play-pause-btn" role="button" aria-label="Play/Pause">
          <svg class="icon" width="22" height="22"><use id="play-pause-icon" href="#i-play"/></svg>
        </span>
        <span id="next-btn" class="ctrl-btn" role="button" aria-label="Weiter">
          <svg class="icon" width="20" height="20"><use href="#i-skip-forward"/></svg>
        </span>
        <span id="repeat-btn" class="ctrl-btn muted" role="button" aria-label="Repeat">
          <svg class="icon" width="16" height="16"><use href="#i-repeat"/></svg>
        </span>
      </div>

      <div class="device-row">
        <svg class="icon" width="13" height="13"><use href="#i-device"/></svg>
        <span>Dieses Gerät</span>
      </div>
    </div>

  </div>

  <!-- Update-Hinweis -->
  <div id="update-toast" class="update-toast hidden">
    <span>Neue Version verfügbar</span>
    <button id="update-reload-btn" class="pill-btn dark xs">Aktualisieren</button>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script src="app.js"></script>
</body>
</html>
